<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Vorher / Nachher Lageplan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body, #map {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    .label {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      background: white;
      padding: 10px 14px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
    }
  </style>
</head>

<body>
  <div class="label">
    <strong>Halle-Neustadt</strong><br>
    Vorher / Nachher
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-side-by-side@2.2.0/leaflet-side-by-side.js"></script>

  <script>
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -4,
      maxZoom: 4
    });

    // HIER die tatsächliche Bildgröße eintragen
    const imageWidth = 5262;
    const imageHeight = 2480;

    const bounds = [[0, 0], [imageHeight, imageWidth]];

    const beforeLayer = L.imageOverlay('./before.png', bounds).addTo(map);
    const afterLayer = L.imageOverlay('./after.png', bounds).addTo(map);

    map.fitBounds(bounds);

    L.control.sideBySide(beforeLayer, afterLayer).addTo(map);
  </script>
</body>
</html>
